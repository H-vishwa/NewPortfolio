<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg-grad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <path d="M0 100 H1600 M0 200 H1600 M0 300 H1600 M0 400 H1600 M0 500 H1600 M0 600 H1600 M0 700 H1600 M0 800 H1600 M0 900 H1600" />
    <path d="M100 0 V1000 M200 0 V1000 M300 0 V1000 M400 0 V1000 M500 0 V1000 M600 0 V1000 M700 0 V1000 M800 0 V1000 M900 0 V1000 M1000 0 V1000 M1100 0 V1000 M1200 0 V1000 M1300 0 V1000 M1400 0 V1000 M1500 0 V1000" />
  </g>

  <!-- Ambient light orbs -->
  <circle cx="350" cy="250" r="320" fill="#06b6d4" opacity="0.08" filter="blur(60px)" />
  <circle cx="1250" cy="700" r="350" fill="#3b82f6" opacity="0.08" filter="blur(80px)" />

  <!-- App Window Container -->
  <g filter="url(#shadow)">
    <!-- Main Window Background -->
    <rect x="120" y="80" width="1360" height="840" rx="20" fill="url(#card-grad)" stroke="#334155" stroke-width="2" />

    <!-- Window Titlebar -->
    <rect x="120" y="80" width="1360" height="64" rx="20" fill="#0f172a" />
    <line x1="120" y1="144" x2="1480" y2="144" stroke="#334155" stroke-width="1.5" />

    <!-- Window Dots -->
    <circle cx="160" cy="112" r="7" fill="#ef4444" />
    <circle cx="185" cy="112" r="7" fill="#f59e0b" />
    <circle cx="210" cy="112" r="7" fill="#10b981" />

    <!-- Title & Badge -->
    <text x="245" y="118" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">ShelfWise — Full-Stack Engineer Simulation | OneRoadmap</text>
    <rect x="1270" y="98" width="170" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
    <text x="1355" y="117" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">PRODUCTION FIX</text>

    <!-- Sidebar -->
    <rect x="120" y="144" width="260" height="776" fill="#090d16" fill-opacity="0.7" />
    <line x1="380" y1="144" x2="380" y2="920" stroke="#334155" stroke-width="1" />

    <!-- Sidebar items -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="14">
      <rect x="140" y="174" width="220" height="42" rx="10" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
      <text x="180" y="200" fill="#38bdf8" font-weight="600">Checkout &amp; Cart Engine</text>
      <circle cx="160" cy="195" r="5" fill="#38bdf8" />

      <rect x="140" y="228" width="220" height="42" rx="10" fill="transparent" />
      <text x="180" y="254" fill="#94a3b8" font-weight="500">Supplier Order REST API</text>
      <circle cx="160" cy="249" r="5" fill="#64748b" />

      <rect x="140" y="282" width="220" height="42" rx="10" fill="transparent" />
      <text x="180" y="308" fill="#94a3b8" font-weight="500">State Sync &amp; Handlers</text>
      <circle cx="160" cy="303" r="5" fill="#64748b" />

      <rect x="140" y="336" width="220" height="42" rx="10" fill="transparent" />
      <text x="180" y="362" fill="#94a3b8" font-weight="500">HTTP Status Protocol</text>
      <circle cx="160" cy="357" r="5" fill="#64748b" />
    </g>

    <!-- Main Content Area -->
    <!-- Top Stats Row -->
    <g transform="translate(420, 175)">
      <!-- Card 1: Infinite Fetch Fix -->
      <rect x="0" y="0" width="310" height="140" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DEFECT RESOLUTION</text>
      <text x="24" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Checkout Fetch Loop</text>
      <text x="24" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Memoized dependency array</text>
      <text x="24" y="118" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ 0 unnecessary refetches</text>

      <!-- Card 2: State Sync -->
      <rect x="340" y="0" width="310" height="140" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="364" y="36" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">EVENT LISTENER FIX</text>
      <text x="364" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Cart Sync Stability</text>
      <text x="364" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Functional state setter update</text>
      <text x="364" y="118" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Zero empty-cart regression</text>

      <!-- Card 3: Idempotency -->
      <rect x="680" y="0" width="340" height="140" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="704" y="36" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">API RESILIENCE</text>
      <text x="704" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Idempotent Orders</text>
      <text x="704" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Unique Idempotency-Key headers</text>
      <text x="704" y="118" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Zero duplicate transactions</text>
    </g>

    <!-- Bottom Detailed Code & API Panel -->
    <g transform="translate(420, 350)">
      <!-- Left Panel: API Schema & Idempotency Key Pipeline -->
      <rect x="0" y="0" width="540" height="520" rx="14" fill="#0c1322" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="540" height="48" rx="14" fill="#172033" />
      <text x="24" y="30" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">supplierOrders.controller.js — Idempotent REST API</text>

      <g font-family="Consolas, monospace" font-size="13" fill="#94a3b8">
        <text x="24" y="80"><tspan fill="#38bdf8">const</tspan> idempotencyKey = req.headers[<tspan fill="#a5f3fc">'x-idempotency-key'</tspan>];</text>
        <text x="24" y="110"><tspan fill="#f43f5e">if</tspan> (!isValidObjectId(supplierId)) {</text>
        <text x="48" y="135"><tspan fill="#f59e0b">// Corrected: 400 Bad Request instead of 200 OK</tspan></text>
        <text x="48" y="160"><tspan fill="#f43f5e">return</tspan> res.<tspan fill="#10b981">status(400)</tspan>.json({ error: <tspan fill="#a5f3fc">'Invalid parameter'</tspan> });</text>
        <text x="24" y="185">}</text>
        <text x="24" y="225"><tspan fill="#f59e0b">// Check cached operation key on MongoDB</tspan></text>
        <text x="24" y="250"><tspan fill="#38bdf8">const</tspan> existing = <tspan fill="#38bdf8">await</tspan> OrderCache.findOne({ key: idempotencyKey });</text>
        <text x="24" y="275"><tspan fill="#f43f5e">if</tspan> (existing) {</text>
        <text x="48" y="300"><tspan fill="#f43f5e">return</tspan> res.<tspan fill="#10b981">status(200)</tspan>.json(existing.response);</text>
        <text x="24" y="325">}</text>
        <text x="24" y="365"><tspan fill="#38bdf8">const</tspan> newOrder = <tspan fill="#38bdf8">await</tspan> Orders.create(orderPayload);</text>
        <text x="24" y="390"><tspan fill="#38bdf8">await</tspan> OrderCache.create({ key: idempotencyKey, response: newOrder });</text>
        <text x="24" y="420"><tspan fill="#f43f5e">return</tspan> res.<tspan fill="#10b981">status(201)</tspan>.json(newOrder);</text>
      </g>

      <!-- Right Panel: Architectural Specs & Tech Badges -->
      <g transform="translate(560, 0)">
        <rect x="0" y="0" width="460" height="520" rx="14" fill="#0c1322" stroke="#334155" stroke-width="1.5" />
        <rect x="0" y="0" width="460" height="48" rx="14" fill="#172033" />
        <text x="24" y="30" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Verification &amp; Architecture</text>

        <g font-family="system-ui, sans-serif" font-size="13" transform="translate(24, 80)">
          <!-- Item 1 -->
          <circle cx="10" cy="10" r="10" fill="#10b981" fill-opacity="0.2" />
          <text x="32" y="15" fill="#f8fafc" font-weight="700">Next.js &amp; React Hook Optimization</text>
          <text x="32" y="38" fill="#94a3b8" font-size="12">Memoized fetch callback prevents re-render loop on checkout.</text>

          <!-- Item 2 -->
          <g transform="translate(0, 75)">
            <circle cx="10" cy="10" r="10" fill="#10b981" fill-opacity="0.2" />
            <text x="32" y="15" fill="#f8fafc" font-weight="700">Global Cart State Synchronization</text>
            <text x="32" y="38" fill="#94a3b8" font-size="12">Refactored event listeners to use functional updater pattern.</text>
          </g>

          <!-- Item 3 -->
          <g transform="translate(0, 150)">
            <circle cx="10" cy="10" r="10" fill="#10b981" fill-opacity="0.2" />
            <text x="32" y="15" fill="#f8fafc" font-weight="700">HTTP Status Code Precision</text>
            <text x="32" y="38" fill="#94a3b8" font-size="12">Invalid parameter responses corrected from 200 OK to 400 Bad Request.</text>
          </g>

          <!-- Item 4 -->
          <g transform="translate(0, 225)">
            <circle cx="10" cy="10" r="10" fill="#10b981" fill-opacity="0.2" />
            <text x="32" y="15" fill="#f8fafc" font-weight="700">High-Efficiency Database Indexing</text>
            <text x="32" y="38" fill="#94a3b8" font-size="12">Indexed key fields in MongoDB for high-read performance.</text>
          </g>

          <!-- Tech stack tags -->
          <g transform="translate(0, 310)">
            <rect x="0" y="0" width="80" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
            <text x="40" y="18" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Next.js</text>

            <rect x="90" y="0" width="70" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
            <text x="125" y="18" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">React</text>

            <rect x="170" y="0" width="90" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
            <text x="215" y="18" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">MongoDB</text>

            <rect x="270" y="0" width="95" height="28" rx="14" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
            <text x="317" y="18" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="600">REST APIs</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>