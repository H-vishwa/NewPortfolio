<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="ap-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="ap-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="ap-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#ap-bg-grad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#9ca3af" stroke-width="1">
    <path d="M0 100 H1600 M0 200 H1600 M0 300 H1600 M0 400 H1600 M0 500 H1600 M0 600 H1600 M0 700 H1600 M0 800 H1600 M0 900 H1600" />
    <path d="M100 0 V1000 M200 0 V1000 M300 0 V1000 M400 0 V1000 M500 0 V1000 M600 0 V1000 M700 0 V1000 M800 0 V1000 M900 0 V1000 M1000 0 V1000 M1100 0 V1000 M1200 0 V1000 M1300 0 V1000 M1400 0 V1000 M1500 0 V1000" />
  </g>

  <!-- Ambient light orbs -->
  <circle cx="350" cy="250" r="320" fill="#8b5cf6" opacity="0.09" filter="blur(70px)" />
  <circle cx="1250" cy="700" r="350" fill="#ec4899" opacity="0.08" filter="blur(80px)" />

  <!-- App Window Container -->
  <g filter="url(#ap-shadow)">
    <!-- Main Window Background -->
    <rect x="120" y="80" width="1360" height="840" rx="20" fill="url(#ap-card-grad)" stroke="#374151" stroke-width="2" />

    <!-- Window Titlebar -->
    <rect x="120" y="80" width="1360" height="64" rx="20" fill="#111827" />
    <line x1="120" y1="144" x2="1480" y2="144" stroke="#374151" stroke-width="1.5" />

    <!-- Window Dots -->
    <circle cx="160" cy="112" r="7" fill="#ef4444" />
    <circle cx="185" cy="112" r="7" fill="#f59e0b" />
    <circle cx="210" cy="112" r="7" fill="#10b981" />

    <!-- Title & Badge -->
    <text x="245" y="118" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">A+ Classes – Exam &amp; Paper Generator Platform</text>
    <rect x="1270" y="98" width="170" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1" />
    <text x="1355" y="117" text-anchor="middle" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">REACT 19 + MERN</text>

    <!-- Sidebar -->
    <rect x="120" y="144" width="260" height="776" fill="#0b0f19" fill-opacity="0.75" />
    <line x1="380" y1="144" x2="380" y2="920" stroke="#374151" stroke-width="1" />

    <!-- Sidebar items -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="14">
      <rect x="140" y="174" width="220" height="42" rx="10" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1" />
      <text x="180" y="200" fill="#c084fc" font-weight="600">Question Bank (7 Types)</text>
      <circle cx="160" cy="195" r="5" fill="#c084fc" />

      <rect x="140" y="228" width="220" height="42" rx="10" fill="transparent" />
      <text x="180" y="254" fill="#9ca3af" font-weight="500">WYSIWYG MathLive</text>
      <circle cx="160" cy="249" r="5" fill="#6b7280" />

      <rect x="140" y="282" width="220" height="42" rx="10" fill="transparent" />
      <text x="180" y="308" fill="#9ca3af" font-weight="500">1/2-Column Print Engine</text>
      <circle cx="160" cy="303" r="5" fill="#6b7280" />

      <rect x="140" y="336" width="220" height="42" rx="10" fill="transparent" />
      <text x="180" y="362" fill="#9ca3af" font-weight="500">RBAC &amp; Auth (JWT+OAuth)</text>
      <circle cx="160" cy="357" r="5" fill="#6b7280" />
    </g>

    <!-- Main Content Area -->
    <!-- Top Stats Row -->
    <g transform="translate(420, 175)">
      <!-- Card 1: 7 Question Formats -->
      <rect x="0" y="0" width="310" height="140" rx="14" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
      <text x="24" y="36" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURRICULUM ENGINE</text>
      <text x="24" y="68" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="20" font-weight="800">7 Question Formats</text>
      <text x="24" y="98" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Drag-and-drop paper reordering</text>
      <text x="24" y="118" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Global question bank reuse</text>

      <!-- Card 2: MathLive & KaTeX -->
      <rect x="340" y="0" width="310" height="140" rx="14" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
      <text x="364" y="36" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">FORMULA EDITOR</text>
      <text x="364" y="68" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="20" font-weight="800">MathLive &amp; KaTeX</text>
      <text x="364" y="98" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">WYSIWYG formula editing</text>
      <text x="364" y="118" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Lazy-loaded math bundles</text>

      <!-- Card 3: Print Engine -->
      <rect x="680" y="0" width="340" height="140" rx="14" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
      <text x="704" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PRINT ENGINE</text>
      <text x="704" y="68" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="20" font-weight="800">1/2-Column Exam Print</text>
      <text x="704" y="98" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Browser-native watermarking</text>
      <text x="704" y="118" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Vector typography &amp; layout</text>
    </g>

    <!-- Bottom Detailed Exam Preview Panel -->
    <g transform="translate(420, 350)">
      <!-- Left Panel: Exam Mockup Preview -->
      <rect x="0" y="0" width="540" height="520" rx="14" fill="#0f172a" stroke="#374151" stroke-width="1.5" />
      <rect x="0" y="0" width="540" height="48" rx="14" fill="#1e293b" />
      <text x="24" y="30" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="600">Generated Examination Paper — 2-Column Vector Layout</text>

      <g font-family="serif" font-size="12" fill="#e2e8f0" transform="translate(30, 70)">
        <!-- Header -->
        <text x="240" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">A+ COACHING ACADEMY</text>
        <text x="240" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Periodic Test 2026 | Mathematics &amp; Physics | Max Marks: 80</text>
        <line x1="0" y1="55" x2="480" y2="55" stroke="#475569" stroke-width="1.5" />
        
        <!-- Column 1 -->
        <g transform="translate(0, 75)">
          <text x="0" y="15" font-family="system-ui, sans-serif" font-weight="700" fill="#38bdf8">Q1. Evaluate the integral:</text>
          <text x="15" y="40" font-style="italic" fill="#cbd5e1" font-size="14">∫ (3x² + 2x - 5) dx</text>
          <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">[a] x³ + x² - 5x + C   [b] 6x + 2 + C</text>

          <text x="0" y="115" font-family="system-ui, sans-serif" font-weight="700" fill="#38bdf8">Q2. Calculate electric flux:</text>
          <text x="15" y="140" font-style="italic" fill="#cbd5e1" font-size="14">Φ = ∮ E · dA = q_enc / ε₀</text>
          <text x="0" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Determine flux enclosed by Gaussian surface.</text>
        </g>

        <!-- Divider line -->
        <line x1="240" y1="75" x2="240" y2="380" stroke="#334155" stroke-dasharray="4 4" />

        <!-- Column 2 -->
        <g transform="translate(255, 75)">
          <text x="0" y="15" font-family="system-ui, sans-serif" font-weight="700" fill="#38bdf8">Q3. Solve system of equations:</text>
          <text x="15" y="40" font-style="italic" fill="#cbd5e1" font-size="14">A · X = B, det(A) ≠ 0</text>
          <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Find X using matrix inversion method.</text>

          <text x="0" y="115" font-family="system-ui, sans-serif" font-weight="700" fill="#38bdf8">Q4. Wave optics phase difference:</text>
          <text x="15" y="140" font-style="italic" fill="#cbd5e1" font-size="14">Δφ = (2π / λ) · Δx</text>
          <text x="0" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Compute fringe width on screen D = 1.5m.</text>
        </g>

        <!-- Watermark -->
        <text x="240" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#334155" fill-opacity="0.3" transform="rotate(-20, 240, 270)">A+ CLASSES</text>
      </g>

      <!-- Right Panel: Architectural Specs & Tech Badges -->
      <g transform="translate(560, 0)">
        <rect x="0" y="0" width="460" height="520" rx="14" fill="#0f172a" stroke="#374151" stroke-width="1.5" />
        <rect x="0" y="0" width="460" height="48" rx="14" fill="#1e293b" />
        <text x="24" y="30" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Security &amp; Full-Stack Specifications</text>

        <g font-family="system-ui, sans-serif" font-size="13" transform="translate(24, 80)">
          <!-- Item 1 -->
          <circle cx="10" cy="10" r="10" fill="#8b5cf6" fill-opacity="0.25" />
          <text x="32" y="15" fill="#f8fafc" font-weight="700">7 Question Formats &amp; Bank Reuse</text>
          <text x="32" y="38" fill="#94a3b8" font-size="12">MCQ, multi-select, assertion-reason, numerical, matrix, short &amp; long.</text>

          <!-- Item 2 -->
          <g transform="translate(0, 75)">
            <circle cx="10" cy="10" r="10" fill="#8b5cf6" fill-opacity="0.25" />
            <text x="32" y="15" fill="#f8fafc" font-weight="700">MathLive + KaTeX Performance</text>
            <text x="32" y="38" fill="#94a3b8" font-size="12">Code-split and lazy-loaded math engine bundles to cut initial page load.</text>
          </g>

          <!-- Item 3 -->
          <g transform="translate(0, 150)">
            <circle cx="10" cy="10" r="10" fill="#8b5cf6" fill-opacity="0.25" />
            <text x="32" y="15" fill="#f8fafc" font-weight="700">Dual Authentication &amp; RBAC</text>
            <text x="32" y="38" fill="#94a3b8" font-size="12">JWT httpOnly cookies &amp; Firebase OAuth with admin/instructor permission tiers.</text>
          </g>

          <!-- Item 4 -->
          <g transform="translate(0, 225)">
            <circle cx="10" cy="10" r="10" fill="#8b5cf6" fill-opacity="0.25" />
            <text x="32" y="15" fill="#f8fafc" font-weight="700">API Protection &amp; Sanitization</text>
            <text x="32" y="38" fill="#94a3b8" font-size="12">Secured REST APIs with express rate limiting and NoSQL injection sanitization.</text>
          </g>

          <!-- Tech stack tags -->
          <g transform="translate(0, 310)">
            <rect x="0" y="0" width="85" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
            <text x="42" y="18" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">React 19</text>

            <rect x="95" y="0" width="75" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
            <text x="132" y="18" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">Node.js</text>

            <rect x="180" y="0" width="80" height="28" rx="14" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
            <text x="220" y="18" text-anchor="middle" fill="#f43f5e" font-size="11" font-weight="600">Express</text>

            <rect x="270" y="0" width="80" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
            <text x="310" y="18" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">MongoDB</text>

            <rect x="360" y="0" width="90" height="28" rx="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
            <text x="405" y="18" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Tailwind CSS</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>